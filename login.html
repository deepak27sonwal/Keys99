/* =========================================================

========================================================= */

function showError(element, message) {

    element.textContent = message;

    element.classList.add("show");

}


function clearError(element) {

    element.textContent = "";

    element.classList.remove("show");

}


/* =========================================================

========================================================= */

/* =========================================================
   NORMALIZE EMAIL
========================================================= */

function normalizeEmail(email) {

    return email
        .trim()
        .toLowerCase();

}


/* =========================================================
   PHONE VALIDATION
========================================================= */

function getPhoneNumber() {

    const number =
        phoneInput.value
            .replace(/\D/g, "");

    if (number.length !== 10) {

        showError(
            phoneError,
            "Please enter a valid 10-digit mobile number."
        );

        phoneInput.focus();

        return null;

    }


    if (!/^[6-9]\d{9}$/.test(number)) {

        showError(
            phoneError,
            "Please enter a valid Indian mobile number."
        );

        phoneInput.focus();

        return null;

    }


    clearError(phoneError);

    return "+91" + number;

}

   CHECK PHONE IN SUPABASE

async function findUserByPhone(phone) {

        data,

        await supabaseClient
            .from("users")
            .select(
                "id,firebase_uid,phone,email,first_name,middle_name,last_name,user_code"

                "phone",
                phone
            )

    if (error) {

        console.error(

    }


    return data;

}

                },

                "expired-callback": () => {

                    );

                }

            }
        );

}


function resetRecaptcha() {

    if (recaptchaVerifier) {

        try {

            recaptchaVerifier.clear();

        }

        catch (e) {

            console.warn(
                "reCAPTCHA clear error:",
                e
            );

        }

        recaptchaVerifier = null;

    }


    const container =
        document.getElementById(
            "recaptcha-container"

    if (container) {

        container.innerHTML = "";

    }

}


/* =========================================================
   SEND OTP
========================================================= */

async function sendOTP() {

    clearError(phoneError);

    const phone =
        getPhoneNumber();


    if (!phone) {

        return;

    }


    sendOtpButton.disabled = true;

    sendOtpButton.innerHTML =
        "<span>Checking...</span>";


    try {

        /*
         * IMPORTANT:
         * Check whether this phone already has
         * a Keys99 account.
         */

        currentExistingUser =
            await findUserByPhone(phone);


        /*
         * We still send OTP for an existing
         * account. OTP acts as login verification.
         */

        sendOtpButton.innerHTML =
            "<span>Sending OTP...</span>";


        createRecaptcha();

        await recaptchaVerifier.render();


        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                phone,
                recaptchaVerifier
            );


        currentPhone = phone;


        otpSentText.textContent =
            "OTP sent to " + phone;


        /*
         * If existing user, pre-fill their
         * existing information.
         */

        if (currentExistingUser) {

            firstNameInput.value =
                currentExistingUser.first_name ||
                "";

            middleNameInput.value =
                currentExistingUser.middle_name ||
                "";

            lastNameInput.value =
                currentExistingUser.last_name ||
                "";

            emailInput.value =
                currentExistingUser.email ||
                "";

        }

        else {

            firstNameInput.value = "";

            middleNameInput.value = "";

            lastNameInput.value = "";

            emailInput.value = "";

        }


        phonePage.classList.remove("active");


        setTimeout(
            () => {

                phonePage.style.display =
                    "none";

                otpPage.style.display =
                    "block";


                requestAnimationFrame(
                    () => {

                        otpPage.classList.add(
                            "active"
                        );

                    }
                );

            },
            150
        );


        otpInput.value = "";

        otpInput.focus();

        startTimer();

    }

    catch (error) {

        console.error(
            "Firebase Send OTP Error:",
            error
        );


        let message =
            "Unable to send OTP.";


        if (
            error.code ===
            "auth/billing-not-enabled"
        ) {

            message =
                "Firebase billing is not enabled. Please enable billing for the Firebase project.";

        }

        else if (
            error.code ===
            "auth/captcha-check-failed"
        ) {

            message =
                "Security verification failed. Please complete the captcha again.";

        }

        else if (
            error.code ===
            "auth/invalid-phone-number"
        ) {

            message =
                "Invalid mobile number.";

        }

        else if (
            error.code ===
            "auth/too-many-requests"
        ) {

            message =
                "Too many attempts. Please try again later.";

        }

        else if (
            error.code ===
            "auth/quota-exceeded"
        ) {

            message =
                "OTP limit reached. Please try again later.";

        }

        else if (error.message) {

            message =
                error.message;

        }


        showError(
            phoneError,
            message
        );


        resetRecaptcha();

    }

    finally {

        sendOtpButton.disabled = false;

        sendOtpButton.innerHTML =
            "<span>Send OTP</span><b>→</b>";

    }

}


/* =========================================================
   VALIDATE NAME
========================================================= */

function validateName(
    value,
    fieldName,
    required = true
) {

    const name =
        value.trim();


    if (!required && !name) {

        return true;

    }


    if (!name) {

        showError(
            otpError,
            fieldName +
            " is required."
        );

        return false;

    }


    if (!/^[A-Za-zÀ-ÖØ-öø-ÿ\s'-]+$/.test(name)) {

        showError(
            otpError,
            fieldName +
            " contains invalid characters."
        );

        return false;

    }


    if (name.length < 2) {

        showError(
            otpError,
            fieldName +
            " must contain at least 2 characters."
        );

        return false;

    }


    return true;

}


/* =========================================================
   SAVE / UPDATE USER
========================================================= */

async function saveUserToSupabase(
    firebaseUser,
    firstName,
    middleName,
    lastName,
    email
) {

    if (
        !firebaseUser ||
        !firebaseUser.uid
    ) {

        throw new Error(
            "Firebase user information is missing."
        );

    }


    const firebaseUID =
        firebaseUser.uid;


    const phone =
        firebaseUser.phoneNumber ||
        currentPhone ||
        null;


    const userEmail =
        normalizeEmail(
            email ||
            firebaseUser.email ||
            ""
        );


    /*
     * -------------------------------------------------------
     * FIRST: CHECK PHONE
     * -------------------------------------------------------
     */

    if (phone) {

        const phoneUser =
            await findUserByPhone(phone);


        if (
            phoneUser &&
            phoneUser.firebase_uid &&
            phoneUser.firebase_uid !== firebaseUID
        ) {

            /*
             * Same phone belongs to another Firebase
             * account. Do NOT create another account.
             */

            throw new Error(
                "PHONE_ALREADY_REGISTERED"
            );

        }

    }


    /*
     * -------------------------------------------------------
     * SECOND: CHECK EMAIL
     * -------------------------------------------------------
     */

    if (userEmail) {

        const emailUser =
            await findUserByEmail(
                userEmail
            );


        if (
            emailUser &&
            emailUser.firebase_uid &&
            emailUser.firebase_uid !== firebaseUID
        ) {

            /*
             * Same email belongs to another account.
             */

            throw new Error(
                "EMAIL_ALREADY_REGISTERED"
            );

        }

    }


    /*
     * -------------------------------------------------------
     * FIND EXISTING FIREBASE USER
     * -------------------------------------------------------
     */

    const {
        data: firebaseExistingUser,
        error: firebaseFindError
    } =
        await supabaseClient
            .from("users")
            .select(
                "*"
            )
            .eq(
                "firebase_uid",
                firebaseUID
            )
            .maybeSingle();


    if (firebaseFindError) {

        throw firebaseFindError;

    }


    let data;


    /*
     * -------------------------------------------------------
     * UPDATE EXISTING ACCOUNT
     * -------------------------------------------------------
     */

    if (firebaseExistingUser) {

        const {
            data: updatedUser,
            error
        } =
            await supabaseClient
                .from("users")
                .update({

                    phone:
                        phone,

                    first_name:
                        firstName || null,

                    middle_name:
                        middleName || null,

                    last_name:
                        lastName || null,

                    email:
                        userEmail || null

                })
                .eq(
                    "firebase_uid",
                    firebaseUID
                )
                .select()
                .single();


        if (error) {

            throw error;

        }


        data = updatedUser;

    }

    else {

        /*
         * ---------------------------------------------------
         * NEW ACCOUNT
         * ---------------------------------------------------
         */

        const {
            data: newUser,
            error
        } =
            await supabaseClient
                .from("users")
                .insert({

                    firebase_uid:
                        firebaseUID,

                    phone:
                        phone,

                    first_name:
                        firstName || null,

                    middle_name:
                        middleName || null,

                    last_name:
                        lastName || null,

                    email:
                        userEmail || null

                })
                .select()
                .single();


        if (error) {

            throw error;

        }


        data = newUser;

    }


    console.log(
        "Keys99 user saved:",
        data
    );


    return data;

}


/* =========================================================
   VERIFY OTP
========================================================= */

async function verifyOTP() {

    clearError(otpError);


    const otp =
        otpInput.value.trim();


    const firstName =
        firstNameInput.value.trim();


    const middleName =
        middleNameInput.value.trim();


    const lastName =
        lastNameInput.value.trim();


    const email =
        normalizeEmail(
            emailInput.value
        );


    /* -----------------------------------------
       OTP
    ----------------------------------------- */

    if (!/^\d{6}$/.test(otp)) {

        showError(
            otpError,
            "Please enter the 6-digit OTP."
        );

        otpInput.focus();

        return;

    }


    /* -----------------------------------------
       FIRST NAME
    ----------------------------------------- */

    if (
        !validateName(
            firstName,
            "First Name"
        )
    ) {

        firstNameInput.focus();

        return;

    }


    /* -----------------------------------------
       MIDDLE NAME
    ----------------------------------------- */

    if (
        middleName &&
        !validateName(
            middleName,
            "Middle Name",
            false
        )
    ) {

        middleNameInput.focus();

        return;

    }


    /* -----------------------------------------
       LAST NAME
    ----------------------------------------- */

    if (
        !validateName(
            lastName,
            "Last Name"
        )
    ) {

        lastNameInput.focus();

        return;

    }


    /* -----------------------------------------
       EMAIL
    ----------------------------------------- */

    if (
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(
            email
        )
    ) {

        showError(
            otpError,
            "Please enter a valid email address."
        );

        emailInput.focus();

        return;

    }


    if (!confirmationResult) {

        showError(
            otpError,
            "OTP session expired. Please request a new OTP."
        );

        return;

    }


    verifyButton.disabled = true;

    verifyButton.innerHTML =
        "<span>Verifying...</span>";


    showLoading(
        "Verifying OTP..."
    );


    try {

        /* -----------------------------------------
           VERIFY FIREBASE OTP
        ----------------------------------------- */

        const result =
            await confirmationResult.confirm(
                otp
            );


        const firebaseUser =
            result.user;


        console.log(
            "Firebase OTP verified:",
            firebaseUser.uid
        );


        /* -----------------------------------------
           CHECK EMAIL AGAIN
           This protects against changes while
           the OTP was being verified.
        ----------------------------------------- */

        const emailUser =
            await findUserByEmail(
                email
            );


        if (
            emailUser &&
            emailUser.firebase_uid &&
            emailUser.firebase_uid !==
                firebaseUser.uid
        ) {

            throw new Error(
                "EMAIL_ALREADY_REGISTERED"
            );

        }


        showLoading(
            "Creating your Keys99 account..."
        );


        /* -----------------------------------------
           SAVE USER
        ----------------------------------------- */

        const user =
            await saveUserToSupabase(
                firebaseUser,
                firstName,
                middleName,
                lastName,
                email
            );


        /* -----------------------------------------
           LOCAL STORAGE
        ----------------------------------------- */

        localStorage.setItem(
            "keys99_firebase_uid",
            firebaseUser.uid
        );


        localStorage.setItem(
            "keys99_phone",
            firebaseUser.phoneNumber ||
            currentPhone ||
            ""
        );


        localStorage.setItem(
            "keys99_email",
            email
        );


        localStorage.setItem(
            "keys99_first_name",
            firstName
        );


        localStorage.setItem(
            "keys99_middle_name",
            middleName
        );


        localStorage.setItem(
            "keys99_last_name",
            lastName
        );


        localStorage.setItem(
            "keys99_logged_in",
            "true"
        );


        if (
            user &&
            user.user_code
        ) {

            localStorage.setItem(
                "keys99_user_code",
                user.user_code
            );

        }


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        showLoading(
            "Login successful..."
        );


        setTimeout(
            () => {

                window.location.href =
                    "profile.html";

            },
            500
        );

    }

    catch (error) {

        console.error(
            "OTP verification error:",
            error
        );


        let message =
            "Unable to complete login.";


        if (
            error.message ===
            "PHONE_ALREADY_REGISTERED"
        ) {

            message =
                "This mobile number is already registered with another account.";

        }

        else if (
            error.message ===
            "EMAIL_ALREADY_REGISTERED"
        ) {

            message =
                "This email address is already registered with another account.";

        }

        else if (
            error.code ===
            "auth/invalid-verification-code"
        ) {

            message =
                "Incorrect OTP. Please check and try again.";

        }

        else if (
            error.code ===
            "auth/code-expired"
        ) {

            message =
                "OTP has expired. Please request a new OTP.";

        }

        else if (
            error.code ===
            "23505"
        ) {

            message =
                "This phone number or email is already registered.";

        }

        else if (error.message) {

            message =
                error.message;

        }


        showError(
            otpError,
            message
        );


        hideLoading();

    }

    finally {

        verifyButton.disabled = false;

        verifyButton.innerHTML =
            "<span>Verify & Continue</span><b>→</b>";

    }

}


/* =========================================================
   GOOGLE LOGIN
========================================================= */

async function googleLogin() {

    clearError(phoneError);


    googleButton.disabled = true;

    googleButton.innerHTML =
        "<span>Connecting to Google...</span>";


    showLoading(
        "Connecting to Google..."
    );


    try {

        const provider =
            new GoogleAuthProvider();


        provider.setCustomParameters({

            prompt:
                "select_account"

        });


        const result =
            await signInWithPopup(
                auth,
                provider
            );


        const firebaseUser =
            result.user;


        const email =
            normalizeEmail(
                firebaseUser.email ||
                ""
            );


        if (!email) {

            throw new Error(
                "Google account does not have an email address."
            );

        }


        console.log(
            "Google Firebase user:",
            firebaseUser.uid
        );


        /*
         * Check whether email already exists.
         */

        const existingUser =
            await findUserByEmail(
                email
            );


        /*
         * If the email belongs to a different
         * Firebase account, don't create another row.
         */

        if (
            existingUser &&
            existingUser.firebase_uid &&
            existingUser.firebase_uid !==
                firebaseUser.uid
        ) {

            throw new Error(
                "EMAIL_ALREADY_REGISTERED"
            );

        }


        /*
         * For Google login we use Google's
         * display name when available.
         */

        let firstName = "";

        let middleName = "";

        let lastName = "";


        if (firebaseUser.displayName) {

            const parts =
                firebaseUser.displayName
                    .trim()
                    .split(/\s+/);


            if (parts.length === 1) {

                firstName =
                    parts[0];

            }

            else if (parts.length === 2) {

                firstName =
                    parts[0];

                lastName =
                    parts[1];

            }

            else {

                firstName =
                    parts[0];

                lastName =
                    parts[parts.length - 1];

                middleName =
                    parts
                        .slice(
                            1,
                            -1
                        )
                        .join(" ");

            }

        }


        showLoading(
            "Creating your Keys99 account..."
        );


        const user =
            await saveUserToSupabase(
                firebaseUser,
                firstName,
                middleName,
                lastName,
                email
            );


        /* -----------------------------------------
           LOCAL STORAGE
        ----------------------------------------- */

        localStorage.setItem(
            "keys99_firebase_uid",
            firebaseUser.uid
        );


        localStorage.setItem(
            "keys99_email",
            email
        );


        localStorage.setItem(
            "keys99_phone",
            firebaseUser.phoneNumber ||
            ""
        );


        localStorage.setItem(
            "keys99_first_name",
            user.first_name ||
            firstName
        );


        localStorage.setItem(
            "keys99_middle_name",
            user.middle_name ||
            middleName
        );


        localStorage.setItem(
            "keys99_last_name",
            user.last_name ||
            lastName
        );


        localStorage.setItem(
            "keys99_logged_in",
            "true"
        );


        if (
            user &&
            user.user_code
        ) {

            localStorage.setItem(
                "keys99_user_code",
                user.user_code
            );

        }


        showLoading(
            "Login successful..."
        );


        setTimeout(
            () => {

                window.location.href =
                    "profile.html";

            },
            500
        );

    }

    catch (error) {

        console.error(
            "Google login error:",
            error
        );


        let message =
            "Google login could not be completed.";


        if (
            error.message ===
            "EMAIL_ALREADY_REGISTERED"
        ) {

            message =
                "This email address is already registered with another account.";

        }

        else if (
            error.message ===
            "PHONE_ALREADY_REGISTERED"
        ) {

            message =
                "This mobile number is already registered with another account.";

        }

        else if (
            error.code ===
            "auth/popup-closed-by-user"
        ) {

            message =
                "Google login window was closed.";

        }

        else if (
            error.code ===
            "auth/popup-blocked"
        ) {

            message =
                "Google popup was blocked. Please allow popups and try again.";

        }

        else if (
            error.code ===
            "auth/unauthorized-domain"
        ) {

            message =
                "This website domain is not authorized in Firebase.";

        }

        else if (
            error.code ===
            "auth/operation-not-allowed"
        ) {

            message =
                "Google sign-in is not enabled in Firebase.";

        }

        else if (error.message) {

            message =
                error.message;

        }


        showError(
            phoneError,
            message
        );


        hideLoading();

    }

    finally {

        googleButton.disabled = false;

        googleButton.innerHTML = `

            <svg
                class="google-logo"
                viewBox="0 0 48 48"
                aria-hidden="true"
            >

                <path
                    fill="#FFC107"
                    d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.1 8.1 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.4-.4-3.5z"
                />

                <path
                    fill="#FF3D00"
                    d="M6.3 14.7l6.6 4.8C14.7 16.1 19 12 24 12c3.1 0 5.9 1.1 8.1 3.1l5.7-5.7C34.3 6.1 29.4 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"
                />

                <path
                    fill="#4CAF50"
                    d="M24 44c5.2 0 10-2 13.5-5.3l-6.2-5.2C29.7 35.1 27 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"
                />

                <path
                    fill="#1976D2"
                    d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.7 5.5-7 6.8l6.2 5.2C38.2 36.9 44 31.2 44 24c0-1.3-.1-2.4-.4-3.5z"
                />

            </svg>

            <span>
                Continue with Google
            </span>

        `;

    }

}


/* =========================================================
   CHANGE NUMBER
========================================================= */

function changeNumber() {

    clearInterval(
        resendTimer
    );


    resetRecaptcha();


    currentExistingUser =
        null;


    otpPage.classList.remove(
        "active"
    );


    setTimeout(
        () => {

            otpPage.style.display =
                "none";

            phonePage.style.display =
                "block";


            requestAnimationFrame(
                () => {

                    phonePage.classList.add(
                        "active"
                    );

                }
            );

        },
        150
    );


    otpInput.value = "";

    firstNameInput.value = "";

    middleNameInput.value = "";

    lastNameInput.value = "";

    emailInput.value = "";


    clearError(
        otpError
    );

}


/* =========================================================
   HEADER BACK
========================================================= */

function headerBack() {

    if (
        otpPage.classList.contains(
            "active"
        )
    ) {

        changeNumber();

        return;

    }


    window.history.back();

}


/* =========================================================
   RESEND OTP
========================================================= */

async function resendOTP() {

    if (resendSeconds > 0) {

        return;

    }


    if (!currentPhone) {

        return;

    }


    resendButton.disabled = true;

    resendButton.textContent =
        "Sending...";


    try {

        resetRecaptcha();

        createRecaptcha();

        await recaptchaVerifier.render();


        confirmationResult =
            await signInWithPhoneNumber(
                auth,
                currentPhone,
                recaptchaVerifier
            );


        otpSentText.textContent =
            "A new OTP was sent to " +
            currentPhone;


        startTimer();

    }

    catch (error) {

        console.error(
            "Resend OTP error:",
            error
        );


        showError(
            otpError,
            error.message ||
            "Unable to resend OTP. Please try again."
        );


        resetRecaptcha();

    }

    finally {

        resendButton.disabled = false;

    }

}


/* =========================================================
   TIMER
========================================================= */

function startTimer() {

    clearInterval(
        resendTimer
    );


    resendSeconds = 30;


    updateTimer();


    resendTimer =
        setInterval(
            () => {

                resendSeconds--;

                updateTimer();


                if (
                    resendSeconds <= 0
                ) {

                    clearInterval(
                        resendTimer
                    );

                }

            },
            1000
        );

}


function updateTimer() {

    if (resendSeconds > 0) {

        resendButton.disabled = true;

        countdown.textContent =
            "Resend OTP in " +
            resendSeconds +
            "s";

    }

    else {

        resendButton.disabled = false;

        resendButton.textContent =
            "Resend OTP";

        countdown.textContent = "";

    }

}


/* =========================================================
   INPUTS
========================================================= */

phoneInput.addEventListener(
    "input",
    () => {

        phoneInput.value =
            phoneInput.value
                .replace(/\D/g, "")
                .slice(0, 10);

    }
);


otpInput.addEventListener(
    "input",
    () => {

        otpInput.value =
            otpInput.value
                .replace(/\D/g, "")
                .slice(0, 6);

    }
);


/* =========================================================
   CLEAN NAME INPUTS
========================================================= */

[
    firstNameInput,
    middleNameInput,
    lastNameInput
].forEach(
    input => {

        input.addEventListener(
            "input",
            () => {

                input.value =
                    input.value
                        .replace(
                            /[^A-Za-zÀ-ÖØ-öø-ÿ\s'-]/g,
                            ""
                        );

            }
        );

    }
);


/* =========================================================
   EMAIL INPUT
========================================================= */

emailInput.addEventListener(
    "input",
    () => {

        emailInput.value =
            emailInput.value
                .toLowerCase()
                .replace(
                    /\s/g,
                    ""
                );

    }
);


/* =========================================================
   EVENTS
========================================================= */

sendOtpButton.addEventListener(
    "click",
    sendOTP
);


verifyButton.addEventListener(
    "click",
    verifyOTP
);


googleButton.addEventListener(
    "click",
    googleLogin
);


backButton.addEventListener(
    "click",
    changeNumber
);


headerBackButton.addEventListener(
    "click",
    headerBack
);


resendButton.addEventListener(
    "click",
    resendOTP
);


/* =========================================================
   ENTER KEY
========================================================= */

phoneInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendOTP();

        }

    }
);


otpInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            verifyOTP();

        }

    }
);


/* =========================================================
   FIREBASE AUTH STATE
========================================================= */

onAuthStateChanged(
    auth,
    user => {

        if (user) {

            console.log(
                "Firebase user:",
                user.uid
            );

        }

    }
);

</script>
